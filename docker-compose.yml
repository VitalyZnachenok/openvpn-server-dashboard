services:
  openvpn-stats:
    build: .
    container_name: openvpn-stats
    restart: unless-stopped
#    ports:
#      - "5000:5000"
    volumes:
      - /var/log/openvpn:/var/log/openvpn:ro
      - ./data:/app/data
    environment:
      FLASK_ENV: production
      DB_PATH: /app/data/openvpn_stats.db
      UPDATE_INTERVAL: "60"
      SERVERS_CONFIG: "office:/var/log/openvpn/status-openvpn.log:/var/log/openvpn/status-openvpn.log;office-full:/var/log/openvpn/status-openvpn-full.log:/var/log/openvpn/status-openvpn-full.log"
      # Авторизация
      AUTH_ENABLED: "true"
      AUTH_TOKEN: ""  # Укажите токен: python3 -c "import secrets; print(secrets.token_urlsafe(32))"
      # Хранение данных
      RETENTION_DAYS: "90"
      TRAFFIC_HISTORY_RETENTION_DAYS: "30"
      DEFAULT_LIMIT: "50"
      MAX_LIMIT: "500"
      # CORS (по умолчанию — same-origin only)
      # CORS_ORIGINS: "https://example.com,https://other.com"
    networks:
      - openvpn-stats-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: openvpn-stats-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites-enabled:/etc/nginx/sites-enabled:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - openvpn-stats
    networks:
      - openvpn-stats-net

networks:
  openvpn-stats-net:
    driver: bridge
