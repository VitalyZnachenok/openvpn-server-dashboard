# Build the Docker image and publish it to Docker Hub.
#
# Required CI/CD variables (Settings → CI/CD → Variables):
#   DOCKERHUB_USERNAME  Docker Hub login
#   DOCKERHUB_TOKEN     Docker Hub access token with Read & Write scope
#                       (Account settings → Personal access tokens).
#                       Mark it "Masked"; mark it "Protected" only if main and
#                       the release tags are protected, otherwise the job
#                       will not see it.
# Optional:
#   DOCKERHUB_IMAGE     Full repository name; defaults to
#                       <DOCKERHUB_USERNAME>/<project name>.
#
# What gets published:
#   push to the default branch → :latest and :<short sha>
#   git tag vX.Y.Z             → :X.Y.Z (the tag without the leading "v")
#   merge request              → build only, nothing is pushed
# Every image is multi-arch: linux/amd64 and linux/arm64 (see PLATFORMS).
#
# The runner's docker executor must either run with `privileged = true`
# (docker-in-docker) or mount the host's /var/run/docker.sock. The foreign
# architecture is built under QEMU emulation, which is registered through a
# privileged helper container.

stages:
  - build

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.docker:
  stage: build
  image: docker:29
  services:
    - docker:29-dind
  variables:
    # Plain TCP to the dind service: TLS would need the runner to share a
    # /certs/client volume between the job and the service container. The
    # connection never leaves the job's private network.
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    PLATFORMS: linux/amd64,linux/arm64
  before_script:
    # A runner that mounts the host's /var/run/docker.sock needs no dind.
    - if [ -S /var/run/docker.sock ]; then unset DOCKER_HOST; fi
    - |
      i=0
      until docker info >/dev/null 2>&1; do
        i=$((i + 1))
        if [ "$i" -ge 60 ]; then
          echo "Docker daemon is not reachable. The runner needs privileged = true (docker-in-docker) or a mounted /var/run/docker.sock." >&2
          docker info || true
          exit 1
        fi
        sleep 1
      done
    # QEMU handlers for the non-native architecture, then a BuildKit builder
    # (the default docker driver cannot produce multi-platform images).
    - docker run --privileged --rm tonistiigi/binfmt --install arm64,amd64
    - docker buildx create --name "ci-$CI_JOB_ID" --driver docker-container --use
    - docker buildx inspect --bootstrap
  after_script:
    # Matters only with a mounted host socket, where the builder container
    # would otherwise outlive the job.
    - if [ -S /var/run/docker.sock ]; then unset DOCKER_HOST; fi
    - docker buildx rm "ci-$CI_JOB_ID" || true

# Merge requests: prove the image still builds.
build:
  extends: .docker
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - docker buildx build --pull --platform "$PLATFORMS" .

# Default branch and tags: build and push.
publish:
  extends: .docker
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - !reference [.docker, before_script]
    - |
      if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
        echo "DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not set (or are protected and this ref is not)." >&2
        exit 1
      fi
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - IMAGE="${DOCKERHUB_IMAGE:-$DOCKERHUB_USERNAME/$CI_PROJECT_NAME}"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAGS="${CI_COMMIT_TAG#v}"
      else
        TAGS="latest $CI_COMMIT_SHORT_SHA"
      fi
    - TAG_ARGS=""
    - for t in $TAGS; do TAG_ARGS="$TAG_ARGS -t $IMAGE:$t"; done
    # One multi-arch manifest per tag, pushed straight from the builder.
    # Layers are reused from a cache kept in the registry next to the image.
    - >
      docker buildx build --pull --push
      --platform "$PLATFORMS"
      --cache-from "type=registry,ref=$IMAGE:buildcache"
      --cache-to "type=registry,ref=$IMAGE:buildcache,mode=max"
      --label "org.opencontainers.image.revision=$CI_COMMIT_SHA"
      $TAG_ARGS .
    - for t in $TAGS; do docker buildx imagetools inspect "$IMAGE:$t"; done
  after_script:
    - !reference [.docker, after_script]
    - docker logout || true
